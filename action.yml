name: Pipemesh produce
description: Emit an entry of the dispatching Pipemesh job's output manifest — an image the run published.
author: Pipemesh
branding:
  icon: upload
  color: gray-dark
inputs:
  key:
    description: "The output key the Pipemesh job declares (produces: { image: oci })."
    required: true
  type:
    description: oci.
    required: true
  ref:
    description: Where it lives — registry/repo.
    required: true
  digest:
    description: The image's sha256:… digest.
    required: true
  verify:
    description: Check the entry resolves before emitting it (docker or crane).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: emit
      shell: bash
      env:
        PM_KEY: ${{ inputs.key }}
        PM_TYPE: ${{ inputs.type }}
        PM_REF: ${{ inputs.ref }}
        PM_DIGEST: ${{ inputs.digest }}
        PM_VERIFY: ${{ inputs.verify }}
      run: '"$GITHUB_ACTION_PATH/produce.sh"'
    - uses: actions/upload-artifact@v4
      with:
        name: pipemesh-produces-${{ inputs.key }}
        path: ${{ steps.emit.outputs.dir }}
        retention-days: 7
